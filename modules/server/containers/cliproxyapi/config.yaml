host: ""
port: 8317
auth-dir: /root/.cli-proxy-api
debug: false
logging-to-file: true
ws-auth: false

remote-management:
  # Traefik and T3 on the host are not localhost inside the container.
  allow-remote: true
  # Do not set secret-key here: this file is in git and mounted read-only.
  # Set MANAGEMENT_PASSWORD in ${lab.secrets}/cliproxyapi.env instead.
  secret-key: ""
  disable-control-panel: false

quota-exceeded:
  switch-project: true
  switch-preview-model: true
  antigravity-credits: true

# Google returns 429 RESOURCE_EXHAUSTED for agent identity text even when
# Antigravity quota is available. CPA obfuscates these with zero-width spaces (ZWSP).
antigravity:
  sensitive-words:
    - "You are Codex"
    - "a coding agent based on GPT-5"
    - "Codex"
    - "GPT-5"
    - "Claude Agent SDK"
    - "Hermes Agent"
    - "Nous Research"
    - "codex_exec"

# Filter generationConfig.responseJsonSchema for Antigravity requests:
# Upstream Google Gemini rejects requests containing both tools (function declarations)
# and responseJsonSchema with HTTP 400 INVALID_ARGUMENT (e.g. Codex title generation).
# responseMimeType: application/json remains intact.
payload:
  filter:
    - models:
        - name: "*"
          protocol: "antigravity"
      params:
        - "generationConfig.responseJsonSchema"

codex:
  model-level-cooling: true
